name: Almanac Creem payment contract — no live payments

on:
  pull_request:
    paths:
      - "src/lib/payments/**"
      - "scripts/check-creem-payment-contract.mjs"
      - "product-studio/CREEM_PAYMENT_SYSTEM.md"
      - ".github/workflows/creem-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-payments-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reproduce committed dependencies
        run: npm ci
      - name: Check Creem signatures, allowlisting and disabled checkout
        run: node --experimental-strip-types --test scripts/check-creem-payment-contract.mjs
      - name: Protect existing learner goal and no-checkout contract
        run: |
          node --experimental-strip-types scripts/check-learning-guide.mjs
          node scripts/check-product-system.mjs
          node scripts/check-almanac-contact-isolation.mjs
      - name: Type-check and build product prototype
        run: |
          npm run typecheck
          npm run build
      - name: Verify authoritative live legacy checkout remains closed
        run: node scripts/check-checkout-health.mjs
