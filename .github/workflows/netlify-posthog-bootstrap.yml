# One-time SDK dependency bootstrap; delete immediately after npm-generated lockfile is committed.
name: Almanac canonical Netlify PostHog SDK bootstrap

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/netlify-posthog-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: almanac-netlify-posthog-sdk-bootstrap
  cancel-in-progress: false

jobs:
  install-and-verify:
    if: >-
      github.event.pull_request.number == 23 &&
      github.event.pull_request.head.ref == 'feat/almanac-netlify-posthog-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/almanac-netlify-posthog-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install browser analytics SDK
        run: npm install --save posthog-js@1
      - name: Check production and full dependency advisories
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Confirm npm lockfile reproducibility
        run: npm ci
      - name: Verify privacy event contract and consent policy
        run: npm run test:telemetry
      - name: Keep contact isolation and price/plan guardrails
        run: |
          node scripts/check-almanac-contact-isolation.mjs
          node --experimental-strip-types scripts/check-learning-offers.mjs
          node --experimental-strip-types scripts/check-request-origin.mjs
          node --experimental-strip-types scripts/check-payment-confirmation.mjs
      - name: Full types and build of refined Almanac
        run: |
          npm run typecheck
          npm run build
      - name: Commit npm-generated dependencies only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(netlify): install privacy-gated PostHog SDK with generated lockfile"
            git push origin HEAD:refs/heads/feat/almanac-netlify-posthog-v1
          fi
