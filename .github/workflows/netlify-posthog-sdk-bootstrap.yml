# Temporary one-time SDK installation. Delete after a verified lockfile commit.
name: Almanac Netlify PostHog SDK bootstrap

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/netlify-posthog-sdk-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: almanac-netlify-posthog-bootstrap
  cancel-in-progress: false

jobs:
  install-and-verify:
    if: >-
      github.event.pull_request.number == 23 &&
      github.event.pull_request.head.ref == 'feat/almanac-netlify-posthog-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/almanac-netlify-posthog-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install verified PostHog SDK into refined branch with npm
        run: npm install --save-exact posthog-js@1.453.2
      - name: Verify full package security audit
        run: npm audit --audit-level=high
      - name: Reproduce complete npm dependency tree
        run: npm ci
      - name: Run typed event and consent privacy tests
        run: npm run test:telemetry
      - name: Enforce source-of-truth contact isolation and local payment guards
        run: |
          node scripts/check-almanac-contact-isolation.mjs
          node --experimental-strip-types scripts/check-learning-offers.mjs
          node --experimental-strip-types scripts/check-request-origin.mjs
          node --experimental-strip-types scripts/check-payment-confirmation.mjs
      - name: Type-check refined application
        run: npm run typecheck
      - name: Build refined Netlify application
        run: npm run build
      - name: Commit npm-generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(netlify): pin PostHog SDK in refined Almanac lockfile"
            git push origin HEAD:refs/heads/feat/almanac-netlify-posthog-v1
          fi
