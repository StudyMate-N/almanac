# One-time lockfile bootstrap. Must be removed after success.
name: Almanac Netlify security patch bootstrap

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/netlify-security-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: almanac-netlify-security-patch
  cancel-in-progress: false

jobs:
  patch-verified-deps:
    if: >-
      github.event.pull_request.number == 22 &&
      github.event.pull_request.head.ref == 'security/almanac-netlify-deps-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/almanac-netlify-deps-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Patch exact Next.js and OIDC versions and generate npm lockfile
        run: npm install --save-exact next@16.4.6 @vercel/oidc@4.0.9
      - name: Check full dependency tree
        run: npm audit --audit-level=high
      - name: Check production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Reproduce installed dependency tree
        run: npm ci
      - name: Test source and order flow contracts
        run: |
          node --experimental-strip-types scripts/check-learning-offers.mjs
          node --experimental-strip-types scripts/check-request-origin.mjs
          node --experimental-strip-types scripts/check-payment-confirmation.mjs
          node scripts/check-almanac-contact-isolation.mjs
      - name: Typecheck complete refined application
        run: npm run typecheck
      - name: Build complete refined application
        run: npm run build
      - name: Commit npm-generated dependency changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "fix(security): patch Next.js and OIDC in refined Almanac"
            git push origin HEAD:refs/heads/security/almanac-netlify-deps-v1
          fi
