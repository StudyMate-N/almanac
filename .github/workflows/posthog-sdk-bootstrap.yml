# Temporary one-time dependency bootstrap: remove after lockfile is committed.
# Scoped to the author-owned Almanac PR #15 branch; never runs on forks/main.
name: Almanac PostHog SDK lockfile bootstrap

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/posthog-sdk-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: almanac-posthog-sdk-bootstrap
  cancel-in-progress: false

jobs:
  install-sdk-and-commit-lockfile:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 15 &&
      github.event.pull_request.head.ref == 'ops/posthog-observability-contract-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/posthog-observability-contract-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install PostHog browser SDK with npm
        run: npm install --save posthog-js@1
      - name: Verify reproducible install
        run: npm ci
      - name: Run privacy-contract tests
        run: npm run test:telemetry
      - name: Type-check complete application
        run: npm run typecheck
      - name: Build complete application
        run: npm run build
      - name: Commit npm-generated dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "SDK lockfile already synchronized"
          else
            git commit -m "build: install PostHog browser SDK with generated npm lockfile"
            git push origin HEAD:refs/heads/ops/posthog-observability-contract-v1
          fi
