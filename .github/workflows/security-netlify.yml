name: Almanac refined Netlify dependency security

on:
  pull_request:
    paths:
      - "scripts/audit-dependencies.mjs"
      - ".github/workflows/security-netlify.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Restore exact committed lockfile without application scripts
        run: npm ci --ignore-scripts
      - name: Review and block high/critical advisories in full and production trees
        run: node scripts/audit-dependencies.mjs
