name: Almanac telemetry privacy contract

on:
  pull_request:
    paths:
      - "src/lib/observability/**"
      - "scripts/check-observability-contract.mjs"
      - ".github/workflows/telemetry-contract.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-telemetry-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify sanitized event payloads
        run: npm run test:telemetry
