name: Almanac analytics privacy and build checks

on:
  pull_request:
    paths:
      - "src/lib/observability/**"
      - "src/components/analytics-consent.tsx"
      - "src/components/catalog-telemetry.tsx"
      - "src/instrumentation-client.ts"
      - "src/app/layout.tsx"
      - "src/app/page.tsx"
      - "scripts/check-observability-contract.mjs"
      - ".github/workflows/telemetry-contract.yml"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Restore exact npm dependency tree
        run: npm ci
      - name: Verify opt-in policy and sensitive-data allowlist
        run: npm run test:telemetry
      - name: Type-check the complete Next.js app
        run: npm run typecheck
      - name: Build the complete Next.js app without analytics credentials
        run: npm run build
